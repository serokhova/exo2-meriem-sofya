<nav class="menu" aria-label="Navigation principale">
  <div class="links">
    @for (item of items; track item.path) {
      <app-button
        [label]="item.label"
        [routerLink]="['/', item.path]"
        routerLinkActive
        #rla="routerLinkActive"
        variant="nav"
        [active]="rla.isActive">
      </app-button>
    }
  </div>
</nav>
