<section class="panel">
  @if (contactForm) {
    <h1 class="title">Dernier formulaire envoyé</h1>
    <dl class="details">
      <dt class="term">Nom</dt>
      <dd class="value">{{ contactForm.name }}</dd>

      <dt class="term">Prénom</dt>
      <dd class="value">{{ contactForm.surname }}</dd>

      @if (contactForm.age !== null) {
        <dt class="term">Âge</dt>
        <dd class="value">{{ contactForm.age }}</dd>
      }

      @if (contactForm.email) {
        <dt class="term">Email</dt>
        <dd class="value">{{ contactForm.email }}</dd>
      }

      <dt class="term">Commentaire</dt>
      <dd class="value">{{ contactForm.comment }}</dd>
    </dl>
  }
</section>
