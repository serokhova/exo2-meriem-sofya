<div class="container d-flex justify-content-center align-items-center min-vh-100">
  <div class="card p-4 shadow" style="width: 400px;">
    <h3 class="text-center mb-4">Contact</h3>
    <form [formGroup]="contactForm" (ngSubmit)="onSubmit()">
      
      <div class="mb-3">
        <label class="form-label">Prénom *</label>
        <input type="text" class="form-control" formControlName="prenom">
      </div>

      <div class="mb-3">
        <label class="form-label">Nom *</label>
        <input type="text" class="form-control" formControlName="nom">
      </div>

      <div class="mb-3">
        <label class="form-label">Âge</label>
        <input type="number" class="form-control" formControlName="age">
      </div>

      <div class="mb-3 form-check">
        <input type="checkbox" class="form-check-input" id="hideEmail" formControlName="hideEmail" (change)="onHideChange($event)">
        <label class="form-check-label" for="hideEmail">Hide Email</label>
      </div>

      <div class="mb-3" *ngIf="!contactForm.get('hideEmail')?.value">
        <label class="form-label">Email * (doit contenir @)</label>
        <input type="email" class="form-control" formControlName="email">
      </div>

      <div class="mb-3">
        <label class="form-label">Commentaire *</label>
        <textarea class="form-control" formControlName="commentaire" rows="3"></textarea>
      </div>

      <button type="submit" class="btn btn-primary w-100" [disabled]="!contactForm.valid">
        Envoyer
      </button>
    </form>
  </div>
</div>
