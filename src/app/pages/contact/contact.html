<form [formGroup]="contactForm" (ngSubmit)="submitContactForm()">
  <label for="name">Nom: </label>
  <input id="name" type="text" formControlName="name">

  <label for="surname">Prénom: </label>
  <input id="surname" type="text" formControlName="surname">

  <label for="age">Age: </label>
  <input id="age" type="number" formControlName="age">

  <label for="checkbox">Sans email</label>
  <input id="checkbox" type="checkbox" formControlName="checkbox">

  @if (!contactForm.controls.checkbox.value) {
    <label for="email">Email: </label>
    <input id="email" type="email" formControlName="email">
  }

  <label for="comment">Commentaire: </label>
  <input id="comment" type="text" formControlName="comment">

  <button type="submit" [disabled]="contactForm.invalid">Envoyer</button>
</form>
