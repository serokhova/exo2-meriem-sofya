<section class="films">
  <h1 class="films-title">Nos films</h1>

  <div class="choices" role="group" aria-label="Choisir un film">
    @for (film of films; track film.titleFilm) {
      <button
        type="button"
        class="choice"
        [class.choice-active]="film === selectedFilm"
        [attr.aria-pressed]="film === selectedFilm"
        (click)="openDetailsFilm(film.titleFilm)">
        {{ film.titleFilm }}
      </button>
    }
  </div>

  @if (selectedFilm) {
    <article class="film">
      <img
        class="poster"
        [src]="selectedFilm.posterFilm"
        [alt]="'Affiche du film ' + selectedFilm.titleFilm" />
      <h2 class="film-title">{{ selectedFilm.titleFilm }}</h2>
    </article>
  }
</section>
